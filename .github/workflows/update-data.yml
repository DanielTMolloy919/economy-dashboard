name: Update Data

on:
  schedule:
    - cron: '0 22 * * 0'  # Every Sunday 22:00 UTC (Mon 8am AEST)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsx scripts/update-data.ts
      - run: pnpm tsx scripts/update-data-us.ts
      - run: pnpm tsx scripts/update-data-uk.ts
      - run: pnpm tsx scripts/update-data-nz.ts
      - run: pnpm tsx scripts/update-data-ca.ts

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "$(pnpm tsx scripts/generate-commit-message.ts)"
          git push
